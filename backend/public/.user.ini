; Read by PHP-FPM / CGI (not mod_php or the CLI dev server — see
; public/.htaccess and `composer serve` for those). Documents are capped at
; 20 MB by validation; post_max_size leaves room for multipart overhead and
; the other form fields.
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
